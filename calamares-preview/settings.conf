modules-search: [ /home/alxb421/Desktop/pearOS-installer/calamares-preview/modules-search-dir, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/calamares/modules, /usr/share/calamares/modules ]

instances:
- id:       partition
  module:   partition
  config:   partition.conf

# Visual preview only - deliberately NO exec section at all, so there is
# no code path, even via a misclick, that can schedule or run a real
# partition/mount/unpackfs job. This sequence can only ever show a page.
sequence:
- show:
  - partition

branding: pearOS
prompt-install: true
dont-chroot: true
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
