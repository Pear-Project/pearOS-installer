# First entry is the real path on the live ISO (this whole directory gets
# copied to /usr/share/pearOS-installer/, calamares-diskutility/ alongside
# system_install/); second is this dev machine's checkout path, kept so
# local testing here keeps working without editing this file back and
# forth - Calamares silently skips any entry that doesn't exist.
modules-search: [ /usr/share/pearOS-installer/calamares-diskutility/modules-search-dir, /home/alxb421/Desktop/pearOS-installer/calamares-diskutility/modules-search-dir, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/calamares/modules, /usr/share/calamares/modules ]

instances:
- id:       partition
  module:   partition
  config:   partition.conf

# Real Disk Utility replacement for the GParted button in the pearOS
# installer's Recovery menu - partition module only, no mount/unpackfs/
# users/packages/etc, so this can ONLY ever write partition-table/
# filesystem changes to the disk the user picks here. It never installs
# an OS - that's still the separate "Install" flow
# (installer_backend.py's launch_install(), calamares-install-debian).
sequence:
- show:
  - partition
- exec:
  - partition
- show:
  - finished

branding: pearOS
prompt-install: true
dont-chroot: true
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: true
